name: Build SimpMusic 2.1.0 control APK

on:
  push:
    branches:
      - build/deepseek-v210-control
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SimpMusic 2.1.0
        uses: actions/checkout@v4
        with:
          repository: maxrave-dev/SimpMusic
          ref: f26622bdf48be734cbfb65c360124cfeed8907c5
          path: app
          fetch-depth: 1

      - name: Use the exact 2.1.0 core
        run: |
          rm -rf app/core
          git clone --no-checkout https://github.com/maxrave-dev/core.git app/core
          cd app/core
          git fetch --depth 1 origin 454213897e020e8b52097acde25fed3c43a12c73
          git checkout --detach FETCH_HEAD

      - name: Use FOSS build
        working-directory: app
        run: |
          sed -i 's/^isFullBuild=true$/isFullBuild=false/' gradle.properties
          sed -i 's/compottie = "2.2.2-compose-1.12-SNAPSHOT"/compottie = "2.2.2"/' gradle/libs.versions.toml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew androidApp:assembleDebug --no-daemon

      - name: Upload control APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-2.1.0-control-debug
          path: app/androidApp/build/outputs/apk/debug/*.apk
